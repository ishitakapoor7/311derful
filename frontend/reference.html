<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>311derful</title>

<!--
  REFERENCE IMPLEMENTATION — not the product.

  One file, no build step, no framework. Its job is to prove the whole flow
  end to end and to be a working reference for the real frontend. Port the
  logic; don't preserve the markup.

  What is worth copying, because it is product behaviour rather than styling:

  1. Voice mode comes from GET /api/config, never from a user-facing toggle.
     The backend decides which path is live so it can be switched and debugged
     from .env. Handle all three: webspeech, vapi, off.
  2. The text box is always present. Voice is a way in, not the way in — and
     typing is what keeps a demo alive when the mic misbehaves.
  3. A LOW-confidence result looks different AND is spoken. A thin-sample
     number presented as a prediction is the worst thing this app can do.
  4. session_id is a browser-generated UUID in localStorage. It is not
     identity — anyone holding it can read that history.

  Not built here, left for the real frontend: the landing page and the
  Report/Chat presentation toggle.
-->

<style>
  :root {
    --bg:#faf9f7; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e2e0dc;
    --accent:#1c5d99; --bad:#b03a2e; --ok:#1e7a4c; --card:#fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#16171a; --fg:#ececec; --muted:#9a9a9a; --line:#2e3035;
      --accent:#6aa6e0; --bad:#e06c5c; --ok:#4fb383; --card:#1e2024;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .layout { display:flex; min-height:100vh; }
  aside {
    width:17rem; flex:none; border-right:1px solid var(--line);
    padding:1.25rem 1rem; overflow-y:auto; background:var(--card);
  }
  aside[hidden] { display:none; }
  main { flex:1; padding:2rem 1.25rem; max-width:46rem; margin:0 auto; }
  h1 { font-size:1.6rem; margin:0 0 .25rem; }
  .sub { color:var(--muted); margin:0 0 1.5rem; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:flex-start; }
  textarea {
    flex:1 1 20rem; min-height:5.5rem; padding:.75rem; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:inherit;
    font:inherit; resize:vertical;
  }
  select, button {
    padding:.6rem .9rem; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:inherit; font:inherit; cursor:pointer;
  }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button[disabled] { opacity:.5; cursor:default; }
  #mic.listening { background:var(--bad); border-color:var(--bad); color:#fff; }
  /* Distinct from listening on purpose: the call takes ~5s to come up, and the
     button must not look ready to hear before it is. */
  #mic.connecting { background:transparent; border-style:dashed; opacity:.65; }
  #mic.connecting { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .stack { display:flex; flex-direction:column; gap:.5rem; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:1rem 1.15rem; margin-top:1rem;
  }
  .card.low { border-color:var(--bad); border-width:2px; }
  .label { font-size:.78rem; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .headline { font-size:2rem; font-weight:650; line-height:1.1; margin:.3rem 0; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:.3rem; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .outcome { margin:.7rem 0; }
  .outcome .top { display:flex; justify-content:space-between; gap:1rem; font-size:.92rem; }
  .outcome.resolved .bar > i { background:var(--ok); }
  .outcome.failure  .bar > i { background:var(--bad); }
  .caveat { color:var(--bad); font-weight:600; }
  .interim { color:var(--muted); font-style:italic; min-height:1.4em; }
  pre {
    white-space:pre-wrap; background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:.8rem; font-size:.86rem; margin:.5rem 0 0;
  }
  .meta { color:var(--muted); font-size:.85rem; }
  ul { margin:.4rem 0 0; padding-left:1.1rem; }
  li { margin:.35rem 0; }
  .hist { border:0; border-top:1px solid var(--line); padding:.6rem 0; width:100%;
          text-align:left; border-radius:0; background:none; }
  .hist:hover { color:var(--accent); }
  .hist .t { font-weight:600; font-size:.9rem; }
  .dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; margin-right:.35rem; }
  .dot.HIGH { background:var(--ok); } .dot.MEDIUM { background:var(--accent); } .dot.LOW { background:var(--bad); }
</style>

<div class="layout">
  <aside id="sidebar">
    <div class="row" style="justify-content:space-between;align-items:center">
      <strong>Your complaints</strong>
      <button id="clear" title="Clear all" style="padding:.25rem .5rem">✕</button>
    </div>
    <div id="history"><p class="meta">Nothing yet.</p></div>
  </aside>

  <main>
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <div>
        <h1>311derful</h1>
        <p class="sub">Describe a problem. Find out what actually happens to complaints like yours.</p>
      </div>
      <button id="toggleSidebar">☰ History</button>
    </div>

    <div class="row">
      <textarea id="text" placeholder="Type it, or press Speak — e.g. my radiator has been cold for three days"></textarea>
      <div class="stack">
        <select id="lang" hidden></select>
        <button id="mic" hidden>🎤 Speak</button>
        <button id="go" class="primary">Check</button>
      </div>
    </div>
    <p class="interim" id="interim"></p>
    <p class="meta" id="status"></p>

    <div id="out"></div>
  </main>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const API = location.origin;

// session_id: a browser-generated UUID, not identity. Anyone holding it can
// read that history, which is why nothing sensitive goes in it.
const SESSION = localStorage.getItem("sid")
  || (localStorage.setItem("sid", crypto.randomUUID()), localStorage.getItem("sid"));

let CONFIG = { voice_mode: "off", languages: [], llm_configured: true };
let address = null;

// Geolocation is best-effort and never blocks. Declining just means the
// forecast answers citywide and says so.
navigator.geolocation?.getCurrentPosition(
  (p) => { address = `${p.coords.latitude},${p.coords.longitude}`; },
  () => {},
  { timeout: 5000 }
);

// Voice state. MUST be declared before the boot block below calls the init
// functions. Function declarations hoist, but `let` bindings sit in the
// temporal dead zone until this line runs -- with these declared after the
// boot block, `vapi = new Vapi(...)` threw "Cannot access 'vapi' before
// initialization", the catch swallowed it, and the mic button was never
// unhidden. Web Speech failed the same way, uncaught, taking loadHistory()
// with it.
let listening = false, recognition = null, vapi = null;

// Set while we are deliberately hanging up, so the ejection error that follows
// is not reported as a failure.
let endingByUs = false;

// Restarts the 30s idle hang-up. Assigned by initVapi; a no-op on the other
// paths. speak() calls it so answering a question buys a fresh window to ask
// the next one rather than counting toward the timeout.
let keepCallAlive = () => {};

// The original description, held while a clarifying question is on screen so
// the answer can be appended to it instead of replacing it.
let pendingContext = "";
const TEXT_PLACEHOLDER = $("text").placeholder;

// How long a speaker has to stay quiet before we treat the utterance as
// finished. Long enough to survive a mid-sentence breath, short enough that the
// pause does not read as the app having missed the question.
const SILENCE_MS = 1800;

// Same reason this sits above the boot block: `await initVapi()` suspends the
// whole module body, so the awaited continuation runs while every `const`
// below it is still in the temporal dead zone.
const MIC_BLOCKED_MSG =
  "Microphone is blocked for this site. Click the icon at the left of the address bar → " +
  "Microphone → Allow, then reload. You can still type.";

/**
 * True if this origin has a stored "Block" for the microphone.
 *
 * Worth its own check because a denied permission is indistinguishable from a
 * working mic that heard nothing: Chrome shows no prompt, getUserMedia rejects
 * inside the SDK, and the call opens deaf. The permission is per-origin
 * *including the port*, so allowing :8000 does nothing for :5173 -- which is
 * exactly how you end up blocked without remembering blocking anything.
 */
async function micBlocked() {
  try {
    return (await navigator.permissions.query({ name: "microphone" })).state === "denied";
  } catch {
    return false;              // Firefox/Safari don't expose this query; let the call try.
  }
}

// ---------------------------------------------------------------------------
// Boot: the backend decides which voice path is live.
// ---------------------------------------------------------------------------
try {
  CONFIG = await (await fetch(`${API}/api/config`)).json();
} catch {
  $("status").textContent = "Backend unreachable — is uvicorn running?";
}

if (!CONFIG.llm_configured) {
  $("status").textContent = "No ANTHROPIC_API_KEY set, so /api/ask will fail. Add one to backend/.env.";
}

if (CONFIG.voice_mode === "webspeech") initWebSpeech();
else if (CONFIG.voice_mode === "vapi") await initVapi();
// "off": the mic stays hidden; text still works.

loadHistory();

// ---------------------------------------------------------------------------
// Path A — browser SpeechRecognition. No keys, no cost. Cannot detect the
// spoken language, so the backend sends a language list and we show a picker.
// ---------------------------------------------------------------------------
function initWebSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $("status").textContent = "Speech input needs Chrome, Edge, or Safari. You can still type.";
    return;
  }
  $("lang").hidden = false;
  $("lang").innerHTML = CONFIG.languages
    .map((l) => `<option value="${l.tag}">${l.label}</option>`).join("");
  $("mic").hidden = false;

  recognition = new SR();
  recognition.interimResults = true;
  recognition.continuous = false;

  // Both voice paths behave identically from here: recognised words land in the
  // textarea as they settle, stopping never discards them, and only the engine
  // deciding the speaker has finished triggers the ask.
  let base = "";        // whatever was already typed when dictation started
  let heard = false;    // did anything get recognised this run?
  let stoppedByUser = false;

  recognition.onresult = (e) => {
    let final = "", interim = "";
    for (const r of e.results) (r.isFinal ? final += r[0].transcript : interim += r[0].transcript);
    if (final) {
      heard = true;
      $("text").value = [base, final].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
    }
    $("interim").textContent = interim;
  };
  recognition.onerror = (e) => {
    $("status").textContent = e.error === "not-allowed"
      ? MIC_BLOCKED_MSG : `Speech error: ${e.error}.`;
    setListening(false);
  };
  recognition.onend = () => {
    setListening(false);
    // continuous=false means the engine ends the run once it hears the speaker
    // stop -- that is the same end-of-thought signal Vapi gets from silence.
    // A deliberate Stop is not, so it leaves the words for review instead.
    if (heard && !stoppedByUser) ask();
  };

  micBlocked().then((b) => { if (b) $("status").textContent = MIC_BLOCKED_MSG; });

  $("mic").onclick = async () => {
    if (listening) { stoppedByUser = true; return recognition.stop(); }
    if (await micBlocked()) return void ($("status").textContent = MIC_BLOCKED_MSG);
    base = $("text").value.trim();
    heard = false;
    stoppedByUser = false;
    recognition.lang = $("lang").value;
    recognition.start();
    setListening(true);
  };
}

// ---------------------------------------------------------------------------
// Path B — Vapi in the browser. No phone number.
//
// Vapi is the ears and mouth; this page orchestrates; the backend stays the
// brain and stays local. Vapi's own LLM never produces content — we hand
// say() the exact text the backend returned, which is what preserves the
// guarantee that no model invents a number.
//
// It has to be this shape: Vapi's client-side tools need no server URL but
// cannot return a result to the model, so "Vapi's LLM calls our API as a
// tool" is not available.
// ---------------------------------------------------------------------------
async function initVapi() {
  try {
    const { default: Vapi } = await import("https://esm.sh/@vapi-ai/web@2");
    vapi = new Vapi(CONFIG.vapi_public_key);
    $("mic").hidden = false;

    // This file is a <script type="module">, so everything here is module-scoped
    // and invisible to the devtools console -- typing `vapi` there gets you
    // "vapi is not defined" whether or not the SDK loaded, which makes the
    // console useless for diagnosing voice. Hang the handle on window so it
    // isn't, and keep a log of every event so a failed attempt leaves evidence
    // instead of silence.
    window.__vapi = vapi;
    window.__vapiLog = [];
    for (const ev of ["call-start", "call-end", "speech-start", "speech-end",
                      "volume-level", "message", "error"]) {
      vapi.on(ev, (payload) => {
        if (ev === "volume-level") return;             // fires ~10x/sec, drowns the rest
        window.__vapiLog.push({ ev, payload });
        console.log("[vapi]", ev, payload);
      });
    }

    // Silence the assistant's own LLM the moment the call connects. Without
    // this it answers in its own words alongside our say(), and its answer
    // would not be grounded in the cube. 'mute-assistant' is a documented
    // control message (see ControlMessages in @vapi-ai/web types).
    vapi.on("call-start", () => {
      vapi.send({ type: "control", control: "mute-assistant" });
    });

    // Shape confirmed against a live call:
    //   {type:'transcript', role:'user', transcriptType:'partial'|'final', transcript}
    //
    // `final` does NOT mean "done talking" -- the transcriber emits one at every
    // endpoint, so a single sentence arrives as several. A real call produced
    // finals of "Okay. Um." / "He." / "Do." from one continuous utterance.
    // Submitting on the first final therefore asked the backend about "Okay. Um."
    // and, because say() ends the call, threw the rest of the sentence away.
    //
    // So: accumulate finals and submit only after the speaker has actually
    // stopped. Silence is the end-of-thought signal; `final` is just a comma.
    let utterance = [];
    let submitTimer = null;

    // Every recognised final goes straight into the textarea. That is what makes
    // losing dictation structurally impossible: the box, not this array, is where
    // the words live, so it does not matter how the call ends.
    const mirror = () => {
      $("text").value = utterance.join(" ").replace(/\s+/g, " ").trim();
    };

    const submitLater = () => {
      clearTimeout(submitTimer);
      submitTimer = setTimeout(() => {
        if (!utterance.length) return;
        mirror();
        utterance = [];               // next dictation starts a new question
        $("interim").textContent = "";
        ask();                        // reads the textarea mirror() just filled
      }, SILENCE_MS);
    };

    // Cancels a pending submit and ends the dictation WITHOUT touching the
    // textarea. Pressing Stop means stop, not discard -- the words stay on
    // screen to be read, corrected, and sent with the Ask button.
    const resetUtterance = () => { clearTimeout(submitTimer); utterance = []; };

    vapi.on("message", (m) => {
      if (m?.type !== "transcript" || m.role !== "user" || !m.transcript) return;

      if (m.transcriptType === "partial") {
        // Still talking: hold off the submit. Only the in-flight fragment goes
        // in the ghost line -- everything already settled is in the textarea.
        clearTimeout(submitTimer);
        $("interim").textContent = m.transcript;
        return;
      }
      utterance.push(m.transcript);
      mirror();
      $("interim").textContent = "";
      submitLater();
    });

    vapi.on("error", (e) => {
      // Ending a call ejects us from the underlying Daily room, which surfaces
      // as a daily-error immediately afterwards. That is the call working, not
      // failing, and it must not overwrite the answer on screen.
      if (endingByUs) return;
      $("status").textContent = `Vapi: ${e?.message ?? e}`;
      setListening(false);
    });

    // Billing guard: if someone opens the mic and never speaks, the call would
    // sit open and bill by the minute. Hang up after 30s of silence.
    let idleTimer = null;
    const resetIdle = () => {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!listening) return;
        endingByUs = true;           // our hang-up, so don't report the ejection
        vapi.stop();
      }, 30_000);
    };
    keepCallAlive = resetIdle;       // speak() needs it; the call now outlives the answer
    vapi.on("speech-start", resetIdle);
    vapi.on("call-start", () => {
      endingByUs = false;
      // Continue whatever was already typed rather than overwriting it, so
      // starting to speak mid-sentence extends the thought instead of eating it.
      const typed = $("text").value.trim();
      clearTimeout(submitTimer);
      utterance = typed ? [typed] : [];
      setMic("live");                // only now can it actually hear anything
      resetIdle();
    });
    vapi.on("call-end", () => {
      clearTimeout(idleTimer);
      resetUtterance();              // cancels the pending submit; textarea keeps the words
      setListening(false);
    });

    if (await micBlocked()) $("status").textContent = MIC_BLOCKED_MSG;

    $("mic").onclick = async () => {
      if (listening) { endingByUs = true; return vapi.stop(); }
      if (await micBlocked()) return void ($("status").textContent = MIC_BLOCKED_MSG);
      setMic("connecting");          // ~5s before call-start; do not claim to be listening yet
      resetIdle();
      try {
        // start() is async and rejects on a bad assistant id, exhausted
        // credits, or a denied mic. Unawaited, every one of those failures
        // looked identical to a working call that heard nothing.
        await vapi.start(CONFIG.vapi_assistant_id);
      } catch (err) {
        console.error("[vapi] start failed", err);
        $("status").textContent = `Vapi couldn't start the call: ${err?.message ?? err}. You can still type.`;
        setListening(false);
      }
    };
  } catch (err) {
    // Never let a voice failure take the page with it.
    $("status").textContent = `Vapi failed to load (${err.message}). You can still type.`;
  }
}

/**
 * Mic state: "idle" | "connecting" | "live".
 *
 * "connecting" exists because Vapi takes ~5s to bring a call up (measured:
 * 4.9ms to paint the button, 5383ms to call-start). A button that goes red
 * instantly is lying for those five seconds, and everything said into them is
 * lost -- so the button has to say when it is actually able to hear.
 * Web Speech starts in milliseconds and goes straight to "live".
 */
function setMic(state) {
  listening = state !== "idle";
  const mic = $("mic");
  mic.classList.toggle("listening", state === "live");
  mic.classList.toggle("connecting", state === "connecting");
  mic.textContent = state === "idle" ? "🎤 Speak" : "◼ Stop";
  if (state === "idle") $("interim").textContent = "";
  $("status").textContent =
    state === "connecting" ? "Connecting to the mic…"
    : state === "live" ? "Listening — go ahead."
    : "";
}

// A declaration, not a `const` arrow: everything in this file that can be
// reached from the awaited boot block has to hoist.
function setListening(on) { setMic(on ? "live" : "idle"); }

/** Speak a reply through whichever path is live. */
function speak(text, lang) {
  // Deliberately NOT say(text, endCallAfterSpoken=true). Bringing a Vapi call
  // up costs ~5.4s, so hanging up after each answer made every follow-up
  // question pay that again -- five seconds of dead air per turn, with the
  // button already red. Keeping the call open means only the first question
  // pays it and follow-ups are instant. The 30s idle hang-up below is what
  // stops the meter running, so an open mic still can't be left billing.
  if (CONFIG.voice_mode === "vapi" && vapi) {
    keepCallAlive();
    return void vapi.say(text);
  }
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang?.includes("-") ? lang : `${lang || "en"}-${(lang || "en").toUpperCase()}`;
  speechSynthesis.speak(u);
}

// ---------------------------------------------------------------------------
// Ask
// ---------------------------------------------------------------------------
$("go").onclick = ask;
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask();
});

async function ask() {
  const answer = $("text").value.trim();
  if (!answer) return;
  // After a clarifying question this is the answer, not a new complaint: send
  // both halves so the backend classifies the whole problem.
  const text = pendingContext ? `${pendingContext}. ${answer}` : answer;
  $("go").disabled = true;
  $("out").innerHTML = "";
  // Two model calls means a few seconds. Name the work rather than spinning.
  $("status").textContent = "Matching your problem to 311's categories, then checking 22 million records…";

  try {
    const res = await fetch(`${API}/api/ask`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        text,
        lang: CONFIG.voice_mode === "webspeech" ? $("lang").value?.split("-")[0] : null,
        address,
        source: listening ? "voice" : "text",
        session_id: SESSION,
      }),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    render(await res.json());
    loadHistory();
  } catch (err) {
    $("status").textContent = `Something went wrong: ${err.message}`;
  } finally {
    $("go").disabled = false;
  }
}

const PRETTY = {
  VERIFIED_FIXED:"Confirmed fixed", ACTION_TAKEN:"Agency took action",
  NO_ACCESS:"Inspector couldn't get in", DUPLICATE:"Closed as someone else's duplicate",
  NOTHING_FOUND:"Responded, found nothing", NO_ACTION_NEEDED:"Judged no action needed",
  GONE_ON_ARRIVAL:"Responsible party had gone", REFERRED:"Sent to another agency",
  PENDING:"Still open", NO_OUTCOME_GIVEN:"Closed without saying what happened",
};
const RESOLVED = ["VERIFIED_FIXED", "ACTION_TAKEN"];
const pct = (x) => `${Math.round(x * 100)}%`;

function render(d) {
  $("status").textContent = "";

  // Weak taxonomy match: ask rather than forecast against the wrong category.
  if (d.intake.clarifying_question) {
    // Keep the original description and clear the box, so the next thing said
    // or typed is read as the ANSWER and appended. Leaving the old words in
    // place made the answer overwrite them, and "at 2am, upstairs" without
    // "loud music" is a worse query than either half -- which is the whole
    // reason the backend asked.
    pendingContext = $("text").value.trim();
    $("text").value = "";
    $("text").placeholder = "Answer that, and I'll use it with what you already said…";
    $("out").innerHTML = `<div class="card"><div class="label">One quick question</div>
      <p>${esc(d.intake.clarifying_question)}</p></div>`;
    speak(d.intake.clarifying_question, d.intake.detected_lang);
    return;
  }
  pendingContext = "";
  $("text").placeholder = TEXT_PLACEHOLDER;

  const f = d.forecast, a = d.advice;
  const where = { COMMUNITY_BOARD:"in your district", BOROUGH:"in your borough", CITYWIDE:"citywide" }[f.geo_level];

  $("out").innerHTML = `
    <div class="card ${f.confidence_tier === "LOW" ? "low" : ""}">
      <div class="label">${esc(f.complaint_type)}${f.descriptor ? " · " + esc(f.descriptor) : ""} · ${esc(f.agency)}</div>
      <div class="headline">${pct(f.resolved_share)}</div>
      <div>end with the problem actually addressed, ${where}.${
        f.baseline_resolved_share != null ? ` &nbsp;·&nbsp; citywide average ${pct(f.baseline_resolved_share)}` : ""}</div>
      ${a ? `<p>${esc(a.narrative)}</p>` : ""}
      ${a?.caveat ? `<p class="caveat">⚠ ${esc(a.caveat)}</p>` : ""}
    </div>

    <div class="card">
      <div class="label">What actually happens</div>
      ${f.outcomes.map((o) => `
        <div class="outcome ${RESOLVED.includes(o.outcome) ? "resolved" : "failure"}">
          <div class="top"><span>${esc(PRETTY[o.outcome] || o.outcome)}</span>
            <span>${pct(o.share)}${o.median_days_to_close != null ? ` · ${o.median_days_to_close}d` : ""}</span></div>
          <div class="bar"><i style="width:${(o.share * 100).toFixed(1)}%"></i></div>
        </div>`).join("")}
      <p class="meta">
        Based on ${f.sample_size.toLocaleString()} similar complaints ${where}
        (${f.time_window === "FULL_HISTORY" ? "all years" : "recent years"}).
        ${f.unclassified_count ? `${f.unclassified_count.toLocaleString()} more couldn't be classified and are excluded.` : ""}
        ${d.community_board && !d.location_exact ? "Location is approximate." : ""}
      </p>
    </div>

    ${a?.tips?.length ? `<div class="card"><div class="label">What changes the odds</div>
      <ul>${a.tips.map((t) => `<li>${esc(t.text)}</li>`).join("")}</ul></div>` : ""}

    ${a ? `<div class="card"><div class="label">Your complaint, ready to submit</div>
      <p class="meta">We can't file this for you — NYC has no public API for submitting 311 complaints.</p>
      <pre>${esc(a.draft_text)}</pre>
      <button onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent)">Copy</button>
    </div>` : ""}`;

  // The caveat rides along with the narrative: someone listening rather than
  // reading must still hear that the sample was thin.
  if (a) speak(a.caveat ? `${a.narrative} ${a.caveat}` : a.narrative, d.intake.detected_lang);
}

// ---------------------------------------------------------------------------
// History sidebar. Clicking an entry re-renders stored values — no model call.
// ---------------------------------------------------------------------------
$("toggleSidebar").onclick = () => { $("sidebar").hidden = !$("sidebar").hidden; };

$("clear").onclick = async () => {
  await fetch(`${API}/api/history?session_id=${SESSION}`, { method: "DELETE" });
  loadHistory();
};

async function loadHistory() {
  let entries = [];
  try {
    entries = (await (await fetch(`${API}/api/history?session_id=${SESSION}`)).json()).entries;
  } catch { return; }

  $("history").innerHTML = entries.length
    ? entries.map((e, i) => `<button class="hist" data-i="${i}">
        <span class="dot ${e.confidence_tier}"></span><span class="t">${esc(e.complaint_type)}</span>
        <div class="meta">${pct(e.resolved_share)} resolved · ${new Date(e.created_at).toLocaleDateString()}</div>
        <div class="meta">${esc(e.text.slice(0, 60))}${e.text.length > 60 ? "…" : ""}</div>
      </button>`).join("")
    : `<p class="meta">Nothing yet.</p>`;

  for (const btn of $("history").querySelectorAll(".hist")) {
    btn.onclick = () => showStored(entries[+btn.dataset.i]);
  }
}

function showStored(e) {
  // Deliberately no re-run: the stored row has everything needed to redraw.
  $("out").innerHTML = `<div class="card ${e.confidence_tier === "LOW" ? "low" : ""}">
      <div class="label">${esc(e.complaint_type)} · ${esc(e.agency)} · ${new Date(e.created_at).toLocaleString()}</div>
      <div class="headline">${pct(e.resolved_share)}</div>
      <div>ended with the problem actually addressed.</div>
      ${e.narrative ? `<p>${esc(e.narrative)}</p>` : ""}
      <p class="meta">You asked: “${esc(e.text)}” · based on ${e.sample_size?.toLocaleString()} complaints</p>
    </div>
    ${e.draft_text ? `<div class="card"><div class="label">Your complaint</div>
      <pre>${esc(e.draft_text)}</pre></div>` : ""}`;
  $("status").textContent = "";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
</script>
