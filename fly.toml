# Fly.io deployment for 311derful.
#
# One machine serving both the API and the built React app. There is no
# database service: the 117MB cube is baked into the image, read-only, and
# never written to.

app = "311derful"
primary_region = "ewr"          # Newark -- the users and the data are in NYC

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Vapi is live in production. The public key is designed to ship to the
  # browser and is served by /api/config; the private key is never set here or
  # anywhere else in this repo. Both Vapi values are set as Fly secrets rather
  # than here so they are not committed:
  #   fly secrets set VAPI_PUBLIC_KEY=... VAPI_ASSISTANT_ID=... ANTHROPIC_API_KEY=...
  #
  # resolved_voice_mode() degrades to webspeech if either Vapi value is
  # missing, so a mistyped secret costs accuracy rather than the whole mic.
  VOICE_MODE = "vapi"

[http_service]
  internal_port = 8000
  force_https = true            # the microphone requires a secure context
  auto_stop_machines = "suspend"
  # Never scale to zero. A suspended machine resumes in about a second, but a
  # fully stopped one cold-starts a 693MB image -- and the one moment this URL
  # gets opened is while judges are watching.
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  # 512MB is enough for DuckDB to memory-map the cube read-only, but the
  # aggregate queries behind /api/explore are the peak and 256MB is too tight
  # for them.
  memory = "1gb"
